id: delegation_015
domain: delegation
workspace_mode: solo
description: "Act as me, a step after reading mail: the principal asks the Executive to read a prospect's email and, in the same message, set a follow-up to chase them on Friday. The Executive answers from the email and sets the follow-up in the same turn. Approvals decides whether it goes at once or waits on an Approve card; the Executive reports what the tool said (set, or a card is waiting) and never asks them to say go or ask again."
company_context:
  name: Fernway Studio
  industry: Design consultancy
  stage: Bootstrapped
  headcount: 1
delegation:
  person:
    full_name: Olivia Owner
    email: olivia@fernway.example
  thread:
    id: t-proposal
    subject: Proposal feedback
    messages:
      - from: "Dana Prospect <dana@northpeak.example>"
        date: "Wed, 14 Oct 2026"
        text: |
          Hi Olivia, thanks for the proposal. The team likes it, but we need
          the phase two price before we can sign. Can you send it by Friday?

          Dana
query: "What did Dana say about the proposal? Set a follow-up to chase her on Friday if we haven't heard back."
expected_tool_calls:
  - search_my_email
  - read_my_email
  - schedule_followup
expected_topics:
  - dana_needs_the_phase_two_price
  - the_follow_up_is_set_or_waiting_on_a_card
quality_criteria:
  answers_from_the_email: true
  takes_the_follow_up_step_in_the_same_turn: true
  never_asks_them_to_say_go_or_ask_again: true
  reports_the_step_as_the_tool_reported_it: true
  brief: true
