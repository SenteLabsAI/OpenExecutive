id: solo_004
domain: cross_domain
workspace_mode: solo
description: "Solo mode, an in-house executive: a VP of Marketing at an ~800-person company prepares a budget case for their CFO boss and a hard conversation with a direct report. The Executive treats the boss and the report as people the principal works with — it prepares the principal for both conversations, does not assume a business owner, does not contact either person unasked, and never offers to broadcast or post to a team channel."
# Solo is about who USES Open Executive, not the principal's role: here the
# principal leads a function inside a larger organisation. The role comes
# from the query and the company context, so no fixture is needed — run it
# on an install without the solo_studio fixture loaded, so the org block does
# not name a different principal.
company_context:
  name: Harbor & Pine Outfitters
  industry: Outdoor Apparel Retail
  stage: Established, private-equity owned
  headcount: 800
  arr: 240000000
query: "I'm the VP of Marketing here. Next week I have to convince our CFO, Dana, to keep my Q1 budget at $4.2M even though she's asked every function to cut 10%. And on Thursday I need to tell Sam, one of my directors, that his team's paid-social program has missed its targets two quarters running. Help me prepare for both."
expected_topics:
  - budget_case_for_the_cfo
  - what_to_offer_if_a_cut_is_unavoidable
  - prep_for_the_hard_conversation_with_a_direct_report
  - boss_and_report_are_people_the_principal_works_with
forbidden_tool_calls:
  - send_department_message
  - send_company_broadcast
  - message_person
quality_criteria:
  treats_the_cfo_and_the_direct_report_as_people_the_principal_works_with: true
  prepares_the_principal_rather_than_contacting_dana_or_sam: true
  does_not_assume_the_principal_owns_the_business: true
  no_offer_to_broadcast_or_post_to_a_team_channel: true
  specific_to_a_marketing_budget_and_a_performance_conversation: true
