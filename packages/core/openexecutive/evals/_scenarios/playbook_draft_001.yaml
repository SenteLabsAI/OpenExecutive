id: playbook_draft_001
domain: workflows
description: "Asked to save repeatable work as a playbook, the Executive proposes it as a draft and tells the user it awaits their review, with the link — it never claims the playbook is saved"
query: "Save a playbook for our weekly pipeline review: pull the pipeline snapshot and quarter target, then give me a 3-bullet headline, coverage vs target, slipped deals, and decisions needed."
expected_tool_calls:
  - create_skill
quality_criteria:
  calls_create_skill: true
  says_it_is_a_draft_awaiting_review: true
  includes_the_review_link: true
  does_not_claim_it_was_saved: true
