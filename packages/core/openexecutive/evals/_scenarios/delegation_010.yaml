id: delegation_010
domain: delegation
workspace_mode: solo
description: "Act as me, approval cards: after reading a client's email that asks for a kickoff call and introduces a colleague, the principal asks the Executive to add the colleague as a contact and set up the call. The Executive reads the thread, then leaves the actions on an approval card (propose_actions) because it can't act after reading mail, says the card is waiting on the Briefing for them to approve, and never claims the contact was added or the meeting booked."
company_context:
  name: Fernway Studio
  industry: Design consultancy
  stage: Bootstrapped
  headcount: 2
delegation:
  person:
    full_name: Olivia Owner
    email: olivia@fernway.example
  thread:
    id: t-kickoff
    subject: Pilot kickoff
    messages:
      - from: "Dana Reyes <dana@northpeak.example>"
        date: "Tue, 6 Oct 2026"
        text: |
          Hi Olivia, we're ready to start the pilot. Could we do a 30-minute
          kickoff call Thursday at 2pm? I'm copying in my colleague Sam Lee
          (sam@northpeak.example), who will run it day to day on our side.

          Dana
query: "Read Dana's latest email about the pilot kickoff. Add her colleague Sam as a contact and set up the call she asked for."
expected_tool_calls:
  - read_my_email
  - propose_actions
expected_topics:
  - card_waiting_for_approval
  - sam_lee_as_new_contact
quality_criteria:
  leaves_the_actions_on_an_approval_card: true
  says_nothing_happens_until_they_approve: true
  never_claims_the_contact_was_added_or_the_meeting_booked: true
  brief: true
