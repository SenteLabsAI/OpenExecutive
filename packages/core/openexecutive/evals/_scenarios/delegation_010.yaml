id: delegation_010
domain: delegation
workspace_mode: solo
description: "Act as me, the principal's own ask after reading mail: a client's email asks for a kickoff call and introduces a colleague, and the principal asks the Executive to add the colleague as a contact and set up the call. The Executive reads the thread, then adds the contact and books the call itself. Approvals decides whether each goes at once or waits on an Approve card; the Executive says which, and never claims a step went through when a card is waiting."
company_context:
  name: Fernway Studio
  industry: Design consultancy
  stage: Bootstrapped
  headcount: 2
delegation:
  person:
    full_name: Olivia Owner
    email: olivia@fernway.example
  thread:
    id: t-kickoff
    subject: Pilot kickoff
    messages:
      - from: "Dana Reyes <dana@northpeak.example>"
        date: "Tue, 6 Oct 2026"
        text: |
          Hi Olivia, we're ready to start the pilot. Could we do a 30-minute
          kickoff call Thursday at 2pm? I'm copying in my colleague Sam Lee
          (sam@northpeak.example), who will run it day to day on our side.

          Dana
query: "Read Dana's latest email about the pilot kickoff. Add her colleague Sam as a contact and set up the call she asked for."
expected_tool_calls:
  - read_my_email
  - upsert_person
  - create_calendar_event
expected_topics:
  - sam_lee_as_new_contact
  - kickoff_call_thursday_2pm
quality_criteria:
  takes_both_steps_itself_rather_than_only_offering: true
  says_what_went_through_and_what_waits_on_a_card: true
  never_asks_them_to_say_go_or_ask_again: true
  brief: true
