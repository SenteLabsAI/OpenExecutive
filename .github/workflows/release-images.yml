# Publish the API and UI container images to GitHub Container Registry, and
# on a version tag also create the GitHub Release.
#
# Every push to main refreshes the rolling `main` tag; pushing a `vX.Y.Z` git
# tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) publishes the versioned
# `X.Y.Z`, `X.Y` and `latest` tags. Both images are built from the Dockerfiles
# under docker/ with the repo root as context. Note that `make docker` builds
# only the API image (compose runs the UI as a dev server), so this workflow
# is the only thing that builds docker/Dockerfile.ui.
#
# Publishing is not gated on ci.yml: the `main` tag is published in parallel
# with CI, and a tag publishes whatever commit it points at. Tag only commits
# on main that CI has passed.
#
# The job is guarded to this repository: a fork would otherwise run this on
# every push to its own main and fail with a 403 pushing to the hardcoded
# ghcr.io/sentelabsai/* names. A fork that wants its own images
# changes the guard and the image names.
#
# Version tags normally come from merging the release PR that
# release-please.yml maintains; that also creates the GitHub Release. For a
# tag pushed by hand, a `vX.Y.Z` tag also creates the GitHub Release once both
# images are published, using that version's CHANGELOG.md section as the
# notes, so the changelog entry must be merged before the commit is tagged. A tag alone
# never shows under Releases. If the images fail, no release is created; if a
# release for the tag already exists (made by hand), the job leaves it alone.
#
# linux/amd64 and linux/arm64. Each platform is built natively on its own
# GitHub-hosted runner (ubuntu-24.04 / ubuntu-24.04-arm), never under QEMU:
# the API image bakes torch plus two embedding-model caches (see
# docker/Dockerfile), which is impractically slow to build under emulation.
# The `build` jobs push each platform's image by digest only (no tag); the
# `publish` jobs then join an image's two digests into one multi-platform
# manifest list and attach the tags to that. So a tag never points at a
# half-built set: it appears only once both platforms of that image built.
# A failure in any build job skips both `publish` jobs, so a run publishes
# both images or neither.
name: Publish images

# No workflow_dispatch: `type=ref,event=branch` below would publish a tag
# named after whatever branch it was dispatched from. Re-run a failed run from
# the Actions UI instead.
on:
  push:
    branches: [main]
    # Semver only. A bare `v*` would accept `v0.2` or `vnext`, which
    # metadata-action's semver rules ignore, giving a green run that
    # published no release tags. In these patterns `*` is any run of
    # characters and `+` means one-or-more of the preceding class, so
    # `[0-9]+` is what pins each component to digits.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

# Keyed on the ref so consecutive pushes to main run in order and a slow
# older build cannot overwrite the `main` tag after a faster newer one.
# (`git push origin main v0.2.0` starts a branch run and a tag run for the
# same commit in different groups; both write `sha-<short>` from the same
# source, which is harmless.) Never cancel a half-pushed release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    if: github.repository == 'SenteLabsAI/OpenExecutive'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        name: [api, ui]
        arch: [amd64, arm64]
        include:
          - name: api
            dockerfile: docker/Dockerfile
            image: ghcr.io/sentelabsai/openexecutive-api
          - name: ui
            dockerfile: docker/Dockerfile.ui
            image: ghcr.io/sentelabsai/openexecutive-ui
          # Native runners: arm64 builds on GitHub's arm64 Linux runner, which
          # is free for public repositories. Pin the image versions rather
          # than ubuntu-latest so both platforms move together.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here; tags are attached in `publish`.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}

      # Pushed by digest: the per-platform image gets no tag of its own, so
      # nothing tagged can point at one platform alone.
      #
      # Layer cache lives in the registry, not the Actions cache: the API
      # image's dependency layers (torch, two baked embedding models, a
      # second venv) still run to well over a GB even on the CPU-only torch
      # build, and the Actions cache is 10 GB per repository shared across
      # everything, so a `type=gha,mode=max` export would churn it and evict
      # the UI's cache. One cache tag per platform (`buildcache-amd64`,
      # `buildcache-arm64`), since the two never share layers past the base
      # image and would overwrite each other's `mode=max` export.
      # provenance=false keeps the attestation manifest out, which would
      # otherwise show as an `unknown/unknown` row on the package page.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max

      # Hand the digest to `publish` as an empty file named after it.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Same name as the old single-platform job, so required-check settings that
  # name "Publish api" / "Publish ui" keep matching.
  publish:
    name: Publish ${{ matrix.name }}
    needs: build
    if: github.repository == 'SenteLabsAI/OpenExecutive'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/sentelabsai/openexecutive-api
          - name: ui
            image: ghcr.io/sentelabsai/openexecutive-ui
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag set:
      #   v1.2.3 tag  -> 1.2.3, 1.2, latest, sha-<short>
      #   main push   -> main, sha-<short>
      # `latest` follows semver tags only (metadata-action's default
      # latest=auto), never a branch push. No bare `{{major}}` tag while the
      # project is pre-1.0 — a `0` tag would be misleading.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      # One manifest list per tag, pointing at the amd64 and arm64 digests.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          count=$(ls | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests for $IMAGE, found $count"
            exit 1
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    name: GitHub Release
    needs: publish
    if: github.repository == 'SenteLabsAI/OpenExecutive' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The notes are the tag's `## [X.Y.Z]` section of CHANGELOG.md, up to
      # the next heading or the link references at the bottom. A tag with no
      # changelog section fails here rather than publishing an empty release.
      - name: Create release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
            exit 0
          fi
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no [$version] section"
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
