name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run in flight: agents often push several
# times in a row, and each superseded run would otherwise burn a full suite.
# Never cancel main, so every merge keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which suites a PR can affect. Skipped jobs count as passing for
  # required checks. Pushes to main run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter by changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python=true; ui=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE_REF"...HEAD)
            # Python suites only skip when every change is inside the web app.
            if ! echo "$files" | grep -qv '^packages/ui/'; then python=false; fi
            # The web app's checks only run when it changed, or when something
            # they read changed: this workflow, and the Python files its
            # parity tests parse (see CLAUDE.md -> UI lint).
            if ! echo "$files" | grep -qE '^(packages/ui/|\.github/workflows/ci\.yml$|packages/core/openexecutive/api/main\.py$|packages/core/openexecutive/utils/deployment\.py$)'; then ui=false; fi
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  python-lint:
    name: Python lint & type check
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock

      # docker/Dockerfile installs from uv.lock with `uv sync --locked`, which
      # fails the image build if the lock is stale. `uv sync` below would
      # silently refresh a stale lock in this checkout, so check it first.
      - name: Check uv.lock is current
        run: cd packages/core && uv lock --check

      - name: Install dependencies
        run: cd packages/core && uv sync --extra dev

      - name: Run ruff
        run: cd packages/core && uv run ruff check openexecutive/

      - name: Run mypy
        run: cd packages/core && uv run mypy openexecutive/ --ignore-missing-imports

  pr-checks:
    name: PR rules (arch docs, stubs, evals)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Rules from CLAUDE.md ("Architecture Docs", "PR Requirements"). The PR
      # body is read for an "Arch-Docs: n/a - <reason>" waiver; it goes in via
      # env, never interpolated into the script.
      - name: Check PR rules
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/pr_checks.py --base "origin/$BASE_REF"

  python-test:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock

      - name: Install dependencies
        run: cd packages/core && uv sync --extra dev

      # pytest-xdist: one worker per core (4 on ubuntu-latest). `loadfile` keeps
      # each test module on a single worker, so module-level state behaves as in
      # a serial run.
      #
      # TMPDIR on tmpfs: most tests build a fresh SQLite file under tmp_path,
      # and every CREATE/ALTER commits with a disk sync. In RAM those syncs are
      # free, which more than halves the run; each test still gets its own file.
      - name: Run unit tests
        env:
          TMPDIR: /dev/shm
        run: cd packages/core && uv run pytest tests/unit/ -n auto --dist loadfile --tb=short

      # Route-level tests against a temp SQLite DB, with the model calls
      # stubbed; no API key needed. Left out of CI, one rotted unnoticed.
      - name: Run integration tests
        env:
          TMPDIR: /dev/shm
        run: cd packages/core && uv run pytest tests/integration/ -n auto --dist loadfile --tb=short

  ui-typecheck:
    name: UI type check
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install dependencies
        run: cd packages/ui && npm ci

      - name: Type check
        run: cd packages/ui && npx tsc --noEmit

      # `next lint` no longer exists in Next 16; this is the package-wide
      # eslint run (packages/ui/eslint.config.mjs) that replaced it.
      - name: Lint
        run: cd packages/ui && npm run lint

      # node:test suites added in #100. Runs on the same Node 22 the job
      # already uses (--experimental-strip-types needs 22.6+).
      - name: Run UI unit tests
        run: cd packages/ui && npm test

      - name: Build
        run: cd packages/ui && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
